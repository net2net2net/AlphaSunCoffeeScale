name: build-ios

# iOS 云构建：在 GitHub 托管的 macOS 机器上编译 iOS arm64 应用并产出「未签名 IPA」。
# 背景：.NET iOS 的最终链接/打包必须跑在 macOS + Xcode 上，Windows 本机无法完成；
#       公开仓库的 macOS runner 免费，产出的未签名 IPA 可用 Sideloadly / 爱思助手 /
#       AltStore / 巨魔(TrollStore) 等工具自签后安装到真机。
#
# 触发：手动 workflow_dispatch，或推送影响 CoffeeScale/src 的变更。
# 产物：Actions 运行页 Artifacts → AlphaSunCoffeeScale-ios-unsigned-r<编号>.ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CoffeeScale/src/**"
      - "CoffeeScale/CoffeeScale.sln"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ipa:
    # macos-15 镜像保留 Xcode 16.x；macos-latest（26）只有 Xcode 26，与 .NET 9 iOS workload 不兼容
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify SDK version
        working-directory: CoffeeScale
        run: dotnet --version   # global.json 钉住 9.x，防止 runner 默认 SDK 10 抢占

      # .NET 9 iOS workload（iOS 18 SDK 绑定）只支持 Xcode 16.x；镜像里存在大量「残缺壳」目录
      # （16.0/16.0.0、16.4/16.4.0 成对，壳目录只有二进制没有 SDK 数据）。xcrun -find 会受 PATH 干扰，
      # 必须用 DEVELOPER_DIR 显式指向候选目录并强校验 xcodebuild -sdk macosx -find actool。
      # .NET 9 iOS workload 只支持 Xcode 16.x；镜像里 16.x 成对出现（16.4 完整 / 16.4.0 空壳）。
      # 空壳目录 SDK 目录存在但缺 SDKSettings.plist（xcodebuild 报 "SDK cannot be located"），
      # 且 -find actool 探测会误判通过 → 必须用 SDKSettings.plist 文件存在性做硬校验。
      - name: Select a working Xcode 16.x
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app
          XCODE=""
          for CAND in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -Vr); do
            DEV="$CAND/Contents/Developer"
            MAC_PLIST="$DEV/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/SDKSettings.plist"
            IOS_PLIST="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/SDKSettings.plist"
            if [ -f "$MAC_PLIST" ] && [ -f "$IOS_PLIST" ]; then
              XCODE="$CAND"; echo "OK（SDKSettings.plist 双平台齐全）"; break
            fi
            echo "跳过残缺目录 $CAND（缺 SDKSettings.plist）"
          done
          if [ -z "$XCODE" ]; then
            echo "::error::未找到 SDK 完整的 Xcode 16.x（.NET 9 iOS workload 必需）"; exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -license accept
          xcodebuild -version

      # 官方缓解（actions/runner-images#12541）：镜像为省空间裁掉部分平台 SDK 数据，
      # 用 -downloadPlatform 为当前选定的 Xcode 重装 macOS / iOS 平台
      - name: Repair trimmed platform SDKs
        run: |
          echo "== 诊断：SDK 目录实况 =="
          DEV="$(xcode-select -p)"
          ls -la "$DEV/Platforms/MacOSX.platform/Developer/SDKs/" || true
          plutil -p "$DEV/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/SDKSettings.plist" 2>/dev/null | head -5 || true
          echo "== 诊断：重放构建同款调用 =="
          xcodebuild -sdk "$DEV/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" -find actool || true
          echo "== 补装平台 =="
          xcodebuild -downloadPlatform macOS
          xcodebuild -downloadPlatform iOS
          echo "== 补装后复验 =="
          xcodebuild -sdk "$DEV/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" -find actool

      # GitHub 镜像为省空间裁掉了各平台 SDK 的「无版本号别名」（MacOSX.sdk 等），
      # 而 .NET iOS 工具链以别名路径调用 actool/ibtool → 重建符号链接
      - name: Ensure SDK alias symlinks
        run: |
          DEV="${DEVELOPER_DIR:-$(xcode-select -p)}"
          echo "Developer dir: $DEV"
          xcodebuild -showsdks || true
          for P in MacOSX iPhoneOS iPhoneSimulator; do
            DIR="$DEV/Platforms/$P.platform/Developer/SDKs"
            if [ ! -d "$DIR" ]; then echo "::warning::$DIR 不存在，跳过"; continue; fi
            echo "--- $DIR ---"; ls -la "$DIR"
            if [ ! -e "$DIR/$P.sdk" ]; then
              VER="$(ls "$DIR" | grep "^$P[0-9]" | sort -V | tail -1)"
              if [ -n "$VER" ]; then
                sudo ln -s "$VER" "$DIR/$P.sdk"
                echo "已创建别名：$P.sdk -> $VER"
              fi
            else
              echo "$P.sdk 别名已存在"
            fi
          done
          # 验证 actool 可定位
          xcrun -sdk macosx -find actool

      # 装 ios + maccatalyst 两个 workload：UI 库多目标含 net9.0-maccatalyst，
      # 还原阶段会评估全部 TFM，缺 maccatalyst workload 会报 NETSDK1147
      - name: Install iOS & MacCatalyst workloads
        run: dotnet workload install ios maccatalyst

      # 未签名设备构建（CI 无证书）：关闭代码签名并清空授权文件，
      # MtouchLink=SdkOnly 只裁剪 SDK、保留程序集元数据，避免反射被裁。
      - name: Publish iOS app (unsigned, arm64)
        working-directory: CoffeeScale
        run: >
          dotnet publish src/CoffeeScale.iOS/CoffeeScale.iOS.csproj
          -c Release
          -r ios-arm64
          -p:CoffeeEnableApple=true
          -p:EnableCodeSigning=false
          -p:CodesignKey=
          -p:CodesignProvision=
          -p:CodesignEntitlements=
          -p:MtouchLink=SdkOnly
          -o "$GITHUB_WORKSPACE/publish/ios"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/publish/ios"
          APP="$(find . -maxdepth 1 -type d -name '*.app' | head -1 || true)"
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物，目录内容："; ls -la; exit 1
          fi
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          IPA="AlphaSunCoffeeScale-1.5-ios-unsigned-r${GITHUB_RUN_NUMBER}.ipa"
          zip -qry "$IPA" Payload
          unzip -l "$IPA" | tail -5
          echo "IPA_PATH=$GITHUB_WORKSPACE/publish/ios/$IPA" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaSunCoffeeScale-ios-unsigned-r${{ github.run_number }}
          path: publish/ios/*.ipa
          if-no-files-found: error
          retention-days: 90
