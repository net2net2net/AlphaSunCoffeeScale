name: build-desktop

# Linux / macOS 桌面版云构建。
# 桌面工程（CoffeeScale.Avalonia）一套代码出四个 RID：win-x64（本地 Windows 构建）、
# linux-x64、osx-arm64、osx-x64。Linux 与 macOS 在 GitHub 托管 runner 上构建，
# 保证文件权限、可执行位、macOS .app bundle 结构都正确。
#
# 触发：手动 workflow_dispatch，或推送影响 CoffeeScale/src 的变更。
# 产物：Actions 运行页 Artifacts
#   - AlphaSunCoffeeScale-linux-x64-r<编号>   （tar.gz）
#   - AlphaSunCoffeeScale-macos-arm64-r<编号> （tar.gz，内含 .app）
#   - AlphaSunCoffeeScale-macos-x64-r<编号>   （tar.gz，内含 .app）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CoffeeScale/src/**"
      - "CoffeeScale/packaging/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish linux-x64 (self-contained, single file)
        working-directory: CoffeeScale
        run: >
          dotnet publish src/CoffeeScale.Avalonia/CoffeeScale.Avalonia.csproj
          -c Release -r linux-x64
          -o "$GITHUB_WORKSPACE/publish/linux-x64"

      - name: Check native deps
        working-directory: publish/linux-x64
        run: |
          ls -la
          echo "--- ldd 缺失库检查（应为空）---"
          ldd ./CoffeeScale | grep "not found" || echo "OK: 无缺失动态库"

      - name: Package tar.gz
        run: |
          set -euo pipefail
          PKG="AlphaSunCoffeeScale-1.5-linux-x64"
          rm -rf "publish/$PKG" && mkdir -p "publish/$PKG"
          cp publish/linux-x64/CoffeeScale "publish/$PKG/"
          cp CoffeeScale/src/CoffeeScale.Avalonia/Assets/icon-256.png "publish/$PKG/"
          cp CoffeeScale/src/CoffeeScale.Avalonia/Assets/icon-512.png "publish/$PKG/"
          cp CoffeeScale/packaging/linux/AlphaSunCoffeeScale.desktop "publish/$PKG/"
          cp CoffeeScale/packaging/linux/install-linux.sh "publish/$PKG/"
          chmod +x "publish/$PKG/CoffeeScale" "publish/$PKG/install-linux.sh"
          cat > "publish/$PKG/安装说明-Linux.txt" <<'EOF'
AlphaSunCoffeeScale 1.5 · Linux 版（x64，自包含单文件，无需安装 .NET）

【最简单】
  1. 解压后 ./CoffeeScale 直接运行（首次启动约 1-2 秒，原生库自解压）
  2. 想进应用菜单：chmod +x install-linux.sh && ./install-linux.sh
     （装到 ~/.local/share/AlphaSunCoffeeScale，卸载：./install-linux.sh --uninstall）

【系统依赖】自包含包已带 .NET 运行时与 Skia/HarfBuzz，但 X11 与字体库需系统提供：
  Debian/Ubuntu: sudo apt install -y libx11-6 libice6 libsm6 fontconfig libfontconfig1 libssl3 zlib1g
  Fedora/RHEL  : sudo dnf install -y libX11 libICE libSM fontconfig openssl zlib
  Arch         : sudo pacman -S --needed libx11 libice libsm fontconfig openssl zlib

【数据位置】配置与冲煮记录（settings.json / brews.json）生成在程序同目录。
EOF
          tar -czf "publish/${PKG}-r${GITHUB_RUN_NUMBER}.tar.gz" -C publish "$PKG"
          echo "packaged:"; ls -la "publish/${PKG}-r${GITHUB_RUN_NUMBER}.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaSunCoffeeScale-linux-x64-r${{ github.run_number }}
          path: publish/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish ${{ matrix.rid }} (self-contained, single file)
        working-directory: CoffeeScale
        run: >
          dotnet publish src/CoffeeScale.Avalonia/CoffeeScale.Avalonia.csproj
          -c Release -r ${{ matrix.rid }}
          -o "$GITHUB_WORKSPACE/publish/${{ matrix.rid }}"

      - name: Build .app bundle
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          APP="publish/AlphaSunCoffeeScale.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "publish/$RID/CoffeeScale" "$APP/Contents/MacOS/CoffeeScale"
          chmod +x "$APP/Contents/MacOS/CoffeeScale"
          cp CoffeeScale/src/CoffeeScale.Avalonia/Assets/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp CoffeeScale/packaging/macos/Info.plist "$APP/Contents/Info.plist"
          # 未签名包：让用户「右键 → 打开」或 xattr 去隔离属性即可
          cat > "publish/安装说明-macOS-$RID.txt" <<EOF
AlphaSunCoffeeScale 1.5 · macOS 版（$RID，自包含单文件，无需安装 .NET）

【安装】
  1. 解压得到 AlphaSunCoffeeScale.app，拖到「应用程序」文件夹
  2. 首次打开因为无签名会被 Gatekeeper 拦住，两种方式：
     · 右键（或 Control+点按）该 App → 打开 → 确认「打开」
     · 终端执行：xattr -cr /Applications/AlphaSunCoffeeScale.app
  3. 之后双击即可正常启动

【说明】本包未做 Apple 开发者签名与公证（CI 无证书），数据与签名版一致。
       芯片对应：osx-arm64=Apple Silicon（M1/M2/M3…），osx-x64=Intel Mac。
EOF
          PKG="AlphaSunCoffeeScale-1.5-macos-${RID#osx-}-r${GITHUB_RUN_NUMBER}"
          tar -czf "publish/$PKG.tar.gz" -C publish AlphaSunCoffeeScale.app "安装说明-macOS-$RID.txt"
          echo "packaged:"; ls -la "publish/$PKG.tar.gz"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaSunCoffeeScale-macos-${{ matrix.rid }}-r${{ github.run_number }}
          path: publish/*.tar.gz
          if-no-files-found: error
          retention-days: 90
